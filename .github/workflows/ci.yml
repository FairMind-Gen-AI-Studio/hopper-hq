name: ci
on:
  push:
    branches: [main]
  pull_request:

# One run per PR or branch; a new push cancels the run for the previous commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The lowest Node the package supports (engines), and the one the publish job builds with.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node --test test/platform-smoke.mjs

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test -- test/adapters/sessions-dir.test.ts test/adapters/codex.test.ts test/adapters/hooks.test.ts test/server/claude-hooks.test.ts test/server/codex.test.ts test/cli-open-windows.test.ts test/codex-plugin.test.ts
      - run: npm run build
      - run: node --test test/platform-smoke.mjs

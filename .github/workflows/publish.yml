name: publish
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and the provenance attestation; no NPM_TOKEN
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # Node 24 ships npm 11, which trusted publishing needs (11.5.1 or later): no npm upgrade step.
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Tag matches the package and the plugin
        run: |
          tag="${GITHUB_REF_NAME#v}"
          package="$(node -p "require('./package.json').version")"
          plugin="$(node -p "require('./mod/.claude-plugin/plugin.json').version")"
          if [ "$tag" != "$package" ] || [ "$tag" != "$plugin" ]; then
            echo "tag $tag, package $package, plugin $plugin: they must be the same" >&2
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: npm is new enough for trusted publishing
        run: node -e "const [a,b,c]=process.argv[1].split('.').map(Number); if (a*1e6+b*1e3+c < 11005001) { console.error('npm ' + process.argv[1] + ' is older than 11.5.1'); process.exit(1) }" "$(npm --version)"
      - run: npm publish --provenance

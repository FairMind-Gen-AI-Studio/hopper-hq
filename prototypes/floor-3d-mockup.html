<style>
/* Layout: top bar + attention strip over a two-column workspace (3D floor diorama | detail panel); stacks on narrow screens.
   Look: a pastel diorama by day, the same floor at night with screens and lamps glowing. State colors are semantic;
   repo colors (mascot bodies) avoid the state hues; the accent is only for focus and selection. */
:root {
  --bg: #E4E7EE;
  --fg: #18202B;
  --muted: #566173;
  --panel: #FBFCFD;
  --line: #D0D8E1;
  --hover: #EEF2F6;
  --accent: #2C59C9;
  --sign-bg: #20263A;
  --sign-fg: #F3F5FA;

  --sky-top: #CBD9EE;
  --sky-bottom: #F1ECF3;
  --scene-floor: #E5E1EA;
  --scene-wall: #EEE8E0;
  --scene-base: #D3CBC2;
  --scene-desk: #EFE8DA;
  --scene-leg: #3A3F4B;
  --scene-chair: #7C8DB0;
  --scene-monitor: #23262E;
  --scene-key: #D9DCE3;
  --scene-glass: #BCD7F2;
  --scene-wood: #B98A5E;
  --scene-couch: #D08C6E;
  --scene-bean-a: #F2B8C6;
  --scene-bean-b: #F3D27A;
  --scene-plant: #4E9A5A;
  --scene-pot: #C46E4F;
  --scene-board: #FAFAFA;
  --scene-elevator: #A9B0BC;
  --scene-frame: #5C6170;
  --scene-paper: #FFFFFF;
  --scene-eye: #1D1F27;
  --window-glow: #CFE4F7;
  --window-int: 0.45;
  --lamp-glow: #FFE2A8;
  --lamp-int: 0.6;
  --screen-int: 0.9;
  --hemi-sky: #FFFFFF;
  --hemi-ground: #B9B2C4;
  --hemi-int: 1.15;
  --sun: #FFF4E5;
  --sun-int: 1.7;

  --repo-a: #3FB8B0;
  --repo-b: #E58FB9;
  --repo-c: #7C8FE8;
  --feature: #2E3A59;

  --s-needs: #D63A3A;
  --s-done: #1C9A6A;
  --s-working: #E8B030;
  --s-meeting: #6857DB;
  --s-nosignal: #C88A35;
  --s-off: #C3C9D2;
  --needs-ink: #B92D2D;
  --done-ink: #137A53;

  --tmux-bg: #1B2230;
  --tmux-fg: #C9D1DF;
  --tmux-needs: #FF6B6B;
  --tmux-done: #46D69A;

  --font-display: "Archivo", "Arial Narrow", "Helvetica Neue", sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}

    --bg: #0D1320; --fg: #E6EAF2; --muted: #9AA5B9; --panel: #141B2A; --line: #27314A; --hover: #1B2436; --accent: #7EA4FF;
    --sky-top: #0A0F21; --sky-bottom: #1B2244;

    --scene-monitor: #0E1015; --scene-key: #6B7080; --scene-glass: #6E8DB8; --scene-wood: #7A5B40; --scene-couch: #8E5A47;

    --scene-elevator: #5E6575; --scene-frame: #2A2E3A; --scene-paper: #E4E7EE; --scene-eye: #0B0C10;
    --window-glow: #2A3A6E; --window-int: 0.9; --lamp-glow: #FFC870; --lamp-int: 2.4; --screen-int: 2.0;
    --hemi-sky: #8EA2D8; --hemi-ground: #1A1D2A; --hemi-int: 0.6; --sun: #9DB4FF; --sun-int: 0.55;
    --s-needs: #FF5A5F; --s-done: #3DD68C; --s-working: #FFD27A; --s-meeting: #9B8CFF; --s-nosignal: #D9A04A; --s-off: #3A4458;
    --needs-ink: #FF8A8E; --done-ink: #5BE0A0;

}
:root[data-theme="dark"] {
  --bg: #0D1320; --fg: #E6EAF2; --muted: #9AA5B9; --panel: #141B2A; --line: #27314A; --hover: #1B2436; --accent: #7EA4FF;
  --sky-top: #0A0F21; --sky-bottom: #1B2244;
  --scene-floor: #3A3F55; --scene-wall: #484D62; --scene-base: #2E3245; --scene-desk: #8C877C; --scene-leg: #15181F; --scene-chair: #4F5B7A;
  --scene-monitor: #0E1015; --scene-key: #6B7080; --scene-glass: #6E8DB8; --scene-wood: #7A5B40; --scene-couch: #8E5A47;
  --scene-bean-a: #9C6B78; --scene-bean-b: #9C8A50; --scene-plant: #2F6B3B; --scene-pot: #7E4532; --scene-board: #C9CED8;
  --scene-elevator: #5E6575; --scene-frame: #2A2E3A; --scene-paper: #E4E7EE; --scene-eye: #0B0C10;

  --hemi-sky: #8EA2D8; --hemi-ground: #1A1D2A; --hemi-int: 0.6; --sun: #9DB4FF; --sun-int: 0.55;
  --s-needs: #FF5A5F; --s-done: #3DD68C; --s-working: #FFD27A; --s-meeting: #9B8CFF; --s-nosignal: #D9A04A; --s-off: #3A4458;
  --needs-ink: #FF8A8E; --done-ink: #5BE0A0;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { height: 100%; }
body { height: 100%; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
button { font: inherit; color: inherit; }
code { font-family: var(--font-mono); font-size: .92em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: 10px; padding-inline: 16px; padding-block: 12px 16px; }

.topbar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 18px; min-width: 0; }
.brand { margin: 0; font-family: var(--font-display); font-stretch: 72%; font-weight: 800; font-size: 22px; letter-spacing: .14em; text-transform: uppercase; line-height: 1; }
.crumbs { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; min-width: 0; }
.crumbs .sep { opacity: .6; }
.crumbs .here { color: var(--fg); font-weight: 600; }
.crumbs .soon { text-decoration: underline dotted; cursor: help; }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.tag-sample { font-size: 11px; font-weight: 500; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); border: 1px dashed var(--line); padding: 3px 8px; border-radius: 4px; }
.tmux { display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 12px; font-weight: 500; background: var(--tmux-bg); color: var(--tmux-fg); padding: 4px 10px; border-radius: 4px; }
.tmux .k { opacity: .55; }
.tmux .n { color: var(--tmux-needs); }
.tmux .d { color: var(--tmux-done); }

.attention { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 22px; min-width: 0; }
.att-group { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-width: 0; }
.att-label { font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.att-empty { color: var(--muted); font-size: 13px; }
.chip { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 5px 10px 5px 9px; font-size: 13px; cursor: pointer; text-align: left; }
.chip:hover { background: var(--hover); }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.chip.needs { border-color: color-mix(in oklab, var(--s-needs) 50%, var(--line)); }
.chip.needs .dot { background: var(--s-needs); box-shadow: 0 0 0 3px color-mix(in oklab, var(--s-needs) 22%, transparent); }
.chip.done .dot { background: var(--s-done); }
.chip .who { font-weight: 600; white-space: nowrap; font-family: var(--font-mono); font-size: 12.5px; }
.chip .what { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 34ch; min-width: 0; }
.chip .time { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.chip.needs .time { color: var(--needs-ink); font-weight: 600; }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 12px; min-height: 0; }
.stage { position: relative; min-height: 0; min-width: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom)); }
.stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lbl { position: absolute; left: 0; top: 0; white-space: nowrap; will-change: transform; }
.tag { display: inline-flex; align-items: center; gap: 5px; font: 500 11px/1.2 var(--font-mono); color: var(--fg); background: color-mix(in oklab, var(--panel) 90%, transparent); border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px; }
.tag .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--sw); }
.tag.st-needs_you { border-color: var(--s-needs); color: var(--needs-ink); font-weight: 600; }
.tag.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
.sign { font-family: var(--font-display); font-stretch: 75%; font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--sign-fg); background: var(--sign-bg); padding: 3px 7px; border-radius: 3px; line-height: 1.25; }
.sign small { display: block; font-family: var(--font-mono); font-stretch: normal; font-weight: 400; font-size: 10px; letter-spacing: 0; text-transform: none; opacity: .8; }
.stage-tools, .sim { position: absolute; top: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.stage-tools { right: 10px; justify-content: flex-end; }
.sim { left: 10px; }
.tool { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 1px solid var(--line); background: color-mix(in oklab, var(--panel) 92%, transparent); border-radius: 6px; font-size: 12.5px; font-weight: 500; cursor: pointer; }
.tool:hover { background: var(--hover); }
.tool:disabled { opacity: .5; cursor: default; }
.tool svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.sim-clock { font: 500 12px var(--font-mono); color: var(--muted); background: color-mix(in oklab, var(--panel) 85%, transparent); border: 1px solid var(--line); padding: 4px 8px; border-radius: 6px; font-variant-numeric: tabular-nums; }
.log { position: absolute; left: 10px; bottom: 10px; margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; max-width: min(470px, calc(100% - 20px)); pointer-events: none; }
.log li { display: flex; align-items: center; gap: 7px; background: color-mix(in oklab, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; font-size: 12px; min-width: 0; }
.log li:not(:last-child) { opacity: .65; }
.log .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sw); flex: none; }
.log b { font-family: var(--font-mono); font-weight: 600; white-space: nowrap; }
.log span.txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.stage-hint { position: absolute; right: 12px; bottom: 10px; margin: 0; font-size: 12px; color: var(--muted); pointer-events: none; }
.no-webgl { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }

.panel { min-height: 0; min-width: 0; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding-inline: 18px; padding-block: 16px 18px; display: flex; flex-direction: column; gap: 16px; }

@media (max-width: 900px) {
  .app { height: auto; }
  .main { grid-template-columns: minmax(0, 1fr); }
  .stage { height: 480px; }
  .stage-hint { display: none; }
  .log li:nth-last-child(n+3) { display: none; }
  .panel { overflow: visible; }
}

.eyebrow { margin: 0 0 4px; font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.p-title { margin: 0; font-family: var(--font-display); font-stretch: 78%; font-weight: 700; font-size: 24px; letter-spacing: .02em; line-height: 1.1; text-wrap: balance; overflow-wrap: anywhere; }
.p-title.mono { font-family: var(--font-mono); font-stretch: normal; font-size: 18px; font-weight: 600; letter-spacing: 0; }
.p-sub { margin: 6px 0 0; color: var(--muted); }
.p-text { margin: 0; max-width: 62ch; }
.p-note { color: var(--muted); font-size: 13px; }
.p-h3 { margin: 0 0 6px; font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.linkbtn { background: none; border: 0; padding: 2px 4px; border-radius: 4px; color: var(--accent); cursor: pointer; }
.linkbtn:hover { background: var(--hover); }
.back { align-self: flex-start; }
.head-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 9px 2px 7px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--sw); }

.rows, .agents, .phases, .legend, .who { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.row-btn { width: 100%; display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; align-items: center; gap: 2px 12px; padding: 7px 10px; border: 1px solid transparent; border-radius: 6px; background: none; cursor: pointer; text-align: left; }
.row-btn:hover { background: var(--hover); border-color: var(--line); }
.row-btn.sel { border-color: var(--accent); }
.row-btn .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--sw); }
.row-btn .r-name { font-family: var(--font-mono); font-size: 12.5px; font-weight: 500; }
.row-btn .r-task { grid-column: 2; color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
.row-btn .r-state { grid-row: span 2; font-size: 12px; color: var(--muted); white-space: nowrap; }
.island-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 2px 0; }
.island-head .swatch { width: 12px; height: 12px; border-radius: 50%; background: var(--rc); }
.island-head .repo { font-weight: 600; }
.island-head .br { font-family: var(--font-mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }

.facts { margin: 0; display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 8px 12px; }
.facts dt { color: var(--muted); font-size: 12.5px; }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.facts dd.warn { color: var(--needs-ink); font-weight: 500; }
.facts code { background: var(--hover); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.agents li, .phases li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 4px 0; }
.agents .dot, .phases .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sw); }
.agents .a-kind { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.a-state { font-size: 12px; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 7px 12px; cursor: pointer; font-size: 13px; font-weight: 500; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--fg); color: var(--panel); border-color: var(--fg); }
.cmd { display: block; font-family: var(--font-mono); font-size: 12px; background: var(--hover); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; overflow-x: auto; white-space: nowrap; user-select: all; }
.legend li { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 2px 10px; align-items: start; }
.legend .sw { width: 12px; height: 12px; border-radius: 3px; background: var(--sw); margin-top: 3px; }
.legend .ln { font-weight: 600; font-size: 13px; }
.legend .ld { grid-column: 2; color: var(--muted); font-size: 12.5px; }
.who li { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 10px; font-size: 13px; }
.who .k { color: var(--muted); }
.swatches { display: inline-flex; flex-wrap: wrap; gap: 4px 10px; }
.swatches span { display: inline-flex; align-items: center; gap: 5px; }
.swatches i { width: 10px; height: 10px; border-radius: 50%; background: var(--rc); display: inline-block; }

.sw-needs_you { --sw: var(--s-needs); }
.sw-done { --sw: var(--s-done); }
.sw-working { --sw: var(--s-working); }
.sw-in_meeting { --sw: var(--s-meeting); }
.sw-no_signal { --sw: var(--s-nosignal); }
.sw-idle { --sw: var(--s-off); }
.sw-dormant { --sw: var(--s-off); }
.sw-running { --sw: var(--s-meeting); }
.sw-active { --sw: var(--s-meeting); }
.sw-pending { --sw: var(--line); }
.rc-a { --rc: var(--repo-a); } .rc-b { --rc: var(--repo-b); } .rc-c { --rc: var(--repo-c); }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--panel); padding: 9px 14px; border-radius: 8px; font-size: 13px; max-width: calc(100% - 32px); z-index: 10; }
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ---------- Helpers ----------
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const tok = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const tnum = (n, d) => { const v = parseFloat(tok(n)); return Number.isFinite(v) ? v : d; };
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const easeOut = (s) => 1 - Math.pow(1 - s, 3);
const easeInOut = (s) => (s < 0.5 ? 4 * s * s * s : 1 - Math.pow(-2 * s + 2, 3) / 2);

// ---------- Floor layout (world units ≈ metres; x → east, z → south, y ↑) ----------

const EVENTS = [
  { at: 3, fn: () => finishIntern('sw-a1', 0) },
  { at: 7, fn: () => setState('oa-c3', 'working', { step: 'Rebuild the client SDK (6 of 6)', last: 'Bash: rm -rf dist && npm run build' }, 'permission granted in its pane, back to work') },

  { at: 17, fn: () => { agentDone(2); setPhase(1, 'done'); setPhase(2, 'active'); agentStart(3); refreshUI(); } },
  { at: 21, fn: () => setState('oa-d5', 'done', { last: 'Turn finished: schema and handlers updated', step: null }, 'finished its turn') },
  { at: 25, fn: () => setState('sw-c3', 'working', { step: 'Pull conversion numbers (1 of 3)', last: 'Read analytics/checkout.sql' }, 'got a new prompt, back to the desk') },
  { at: 29, fn: () => setState('ps-e6', 'working', { step: 'Fix 2 failing webhook tests', last: 'npm test finished: 2 failures' }, 'test run finished, fixing failures') },
  { at: 33, fn: () => setState('sw-a1', 'needs_you', { reason: { kind: 'Question', text: 'Keep the old address form behind a flag?' } }, 'asks you a question') },
  { at: 38, fn: () => { agentDone(3); setPhase(2, 'done'); setState('ps-d4', 'done', { step: null, last: 'Workflow checkout-verify finished: 4 of 4 agents done' }, 'workflow finished, result ready'); } },
  { at: 44, fn: () => endSim() }
];
let nextEvent = 0;
function endSim() {
  ui.ended = true; ui.playing = false;
  $('sim-toggle').disabled = true;
  $('sim-toggle').textContent = 'Play';
  addLog(null, 'simulation finished. Press Restart to replay.', 'idle');
}
function resetWorld() {
  [...mascots.values()].forEach((m) => m.dispose());
  S = JSON.parse(JSON.stringify(INITIAL));
  S.lounge = {};
  S.sessions.forEach((s) => { s.since = 0; syncSession(s, false); s.interns.forEach((_, k) => syncIntern(s, k, false)); });
  S.workflow.agents.forEach((_, i) => syncAgent(i, false));
  refreshPhases();
  ui.simTime = 0; nextEvent = 0; ui.ended = false; ui.playing = !RM;
  $('sim-toggle').disabled = false;
  $('sim-toggle').textContent = ui.playing ? 'Pause' : 'Play';
  log.length = 0; $('log').innerHTML = '';
  refreshUI();
}

// ---------- Panel, attention strip, tmux ----------
const minsOf = (s) => (s.mins || 0) + Math.floor((ui.simTime - (s.since || 0)) / 60);
const fmtMins = (m) => (m < 1 ? 'now' : m < 60 ? m + 'm' : Math.floor(m / 60) + 'h');
function fakeUuid(seed) {
  let h = 2166136261 >>> 0, out = '';
  for (let k = 0; out.length < 32; k++) {
    for (const ch of seed + k) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; }
    out += h.toString(16).padStart(8, '0');
  }
  return out.slice(0, 8) + '-' + out.slice(8, 12) + '-' + out.slice(12, 16) + '-' + out.slice(16, 20) + '-' + out.slice(20, 32);
}
const resumeCmd = (s) => 'cd ' + ISLANDS[s.island].cwd + ' && claude --resume ' + fakeUuid(s.id);

function renderChrome() {
  const needs = S.sessions.filter((s) => s.state === 'needs_you').sort((a, b) => minsOf(b) - minsOf(a));
  const done = S.sessions.filter((s) => s.state === 'done').sort((a, b) => minsOf(b) - minsOf(a));
  const chip = (s, kind) => {
    const what = kind === 'needs' ? s.reason.kind + ': ' + (s.reason.code || s.reason.text) : s.task;
    return '<button class="chip ' + kind + '" data-goto="' + s.id + '" title="' + esc(what) + '"><span class="dot"></span><span class="who">' + esc(nameOf(s)) +
      '</span><span class="what">' + esc(what) + '</span><span class="time">' + fmtMins(minsOf(s)) + '</span></button>';
  };
  $('attention').innerHTML =
    '<div class="att-group"><span class="att-label">Needs you</span>' + (needs.length ? needs.map((s) => chip(s, 'needs')).join('') : '<span class="att-empty">Nobody is waiting for you.</span>') + '</div>' +
    '<div class="att-group"><span class="att-label">Done, to review</span>' + (done.length ? done.map((s) => chip(s, 'done')).join('') : '<span class="att-empty">Nothing to review.</span>') + '</div>';
  $('tmux').innerHTML = '<span class="k">tmux</span><span class="n">◉' + needs.length + '</span><span class="d">✓' + done.length + '</span>';
}

function panelFloor() {
  const wf = S.workflow, running = wf.agents.filter((a) => a.status === 'running').length;
  let h = '<div><p class="eyebrow">Floor 4 · Feature</p><h2 class="p-title">checkout-v2</h2><p class="p-sub">3 repos working on this feature · ' + S.sessions.length + ' sessions</p></div>';
  h += '<section><h3 class="p-h3">Meeting room</h3><ul class="rows"><li><button class="row-btn sw-' + (running ? 'in_meeting' : 'done') + '" data-room="1">' +
    '<span class="dot"></span><span class="r-name">' + esc(wf.name) + '</span><span class="r-state">' + (running ? running + ' running' : 'finished') + '</span>' +
    '<span class="r-task">Workflow started by ' + esc(nameOf(sess(wf.owner))) + '</span></button></li></ul></section>';
  ISLANDS.forEach((isl, i) => {
    h += '<section><div class="island-head rc-' + isl.rc + '"><span class="swatch"></span><span class="repo">' + esc(isl.repo) + '</span><span class="br">' + esc(isl.branch) + (isl.worktree ? ' · worktree' : '') + '</span></div><ul class="rows">';
    S.sessions.filter((s) => s.island === i).forEach((s) => {
      h += '<li><button class="row-btn sw-' + s.state + (ui.sel && ui.sel.id === s.id ? ' sel' : '') + '" data-goto="' + s.id + '"><span class="dot"></span><span class="r-name">' + esc(nameOf(s)) + '</span>' +
        '<span class="r-state">' + STATES[s.state].label + '</span><span class="r-task">' + esc(s.task) + '</span></button></li>';
    });

  });
  h += '<section><h3 class="p-h3">Who is who</h3><ul class="who">' +
    '<li><span class="k">Colour</span><span class="swatches">' + ISLANDS.map((isl) => '<span class="rc-' + isl.rc + '"><i></i>' + esc(isl.repo) + '</span>').join('') + '</span></li>' +
    '<li><span class="k">Shape</span><span>Round with a beret: a session. Small with an antenna: a subagent. Drop: a workflow agent.</span></li>' +
    '<li><span class="k">Beret</span><span>The feature. Everyone on this floor wears the checkout-v2 one.</span></li></ul></section>';
  h += '<section><h3 class="p-h3">States</h3><ul class="legend">' +
    Object.keys(STATES).map((k) => '<li class="sw-' + k + '"><span class="sw"></span><span class="ln">' + STATES[k].label + '</span><span class="ld">' + STATES[k].desc + '</span></li>').join('') + '</ul></section>';
  return h;
}
function panelSession(id) {
  const s = sess(id), isl = ISLANDS[s.island];
  let h = '<button class="linkbtn back" data-back="1">← Floor 4 · checkout-v2</button>';
  h += '<div><p class="eyebrow">' + esc(isl.repo) + ' · tmux pane ' + esc(s.pane) + '</p><div class="head-row"><h2 class="p-title mono">' + esc(nameOf(s)) + '</h2>' +
    '<span class="pill sw-' + s.state + '">' + STATES[s.state].label + '</span></div></div>';
  h += '<p class="p-text">' + esc(s.task) + '</p><dl class="facts">';
  if (s.state === 'needs_you') h += '<dt>Waiting for</dt><dd class="warn">' + esc(s.reason.kind) + ': ' + esc(s.reason.text) + (s.reason.code ? ' <code>' + esc(s.reason.code) + '</code>' : '') + ' · ' + fmtMins(minsOf(s)) + '</dd>';
  if (s.state === 'no_signal') h += '<dt>Running</dt><dd><code>npm test</code> for ' + minsOf(s) + ' min, no new output</dd>';
  if (s.state === 'in_meeting') h += '<dt>Meeting</dt><dd>Workflow <button class="linkbtn" data-room="1">' + esc(S.workflow.name) + '</button></dd>';
  if (s.state === 'dormant') h += '<dt>Went home</dt><dd>' + esc(s.idleFor) + ' ago</dd>';
  if (s.step) h += '<dt>Current step</dt><dd>' + esc(s.step) + '</dd>';

  h += '<dt>Branch</dt><dd><code>' + esc(isl.branch) + '</code></dd><dt>Folder</dt><dd><code>' + esc(isl.cwd) + '</code></dd></dl>';

function panelRoom() {
  const wf = S.workflow, owner = sess(wf.owner);
  let h = '<button class="linkbtn back" data-back="1">← Floor 4 · checkout-v2</button>';
  h += '<div><p class="eyebrow">Meeting room · workflow</p><h2 class="p-title">' + esc(wf.name) + '</h2><p class="p-sub">Started by <button class="linkbtn" data-goto="' + owner.id + '">' + esc(nameOf(owner)) + '</button></p></div>';
  h += '<section><h3 class="p-h3">Phases (on the whiteboard)</h3><ol class="phases">' + wf.phases.map((p) => '<li class="sw-' + (p.status === 'done' ? 'done' : p.status) + '"><span class="dot"></span><span>' + esc(p.title) + '</span><span class="a-state">' + p.status + '</span></li>').join('') + '</ol></section>';
  h += '<section><h3 class="p-h3">Agents</h3><ul class="agents">' + wf.agents.map((a) => '<li class="sw-' + (a.status === 'done' ? 'done' : a.status) + '"><span class="dot"></span><span>' + esc(a.task) + ' <span class="a-kind">' + esc(a.kind) + '</span></span><span class="a-state">' + a.status + '</span></li>').join('') + '</ul></section>';

function renderPanel() {
  const sel = ui.sel;
  $('panel').innerHTML = !sel ? panelFloor() : sel.type === 'room' ? panelRoom() : panelSession(sel.id);
}
function refreshUI() {
  renderChrome();
  renderPanel();
  S.sessions.forEach(updateTag);
  const rs = document.getElementById('room-sign');
  if (rs) { const active = S.workflow.phases.find((p) => p.status === 'active'); rs.textContent = S.workflow.name + ' · ' + (active ? active.title : 'finished'); }
}
function select(sel) {
  ui.sel = sel;
  refreshUI();
  if (sel && sel.type === 'session') {
    const m = mascots.get(sel.id), s = sess(sel.id);
    const p = m ? m.group.position : (() => { const d = deskOf(s); return new THREE.Vector3(d.x, 0, d.z); })();
    panTo(p.x, p.z);
  }
}

// ---------- Camera moves ----------
let camAnim = null;
function animateCamera(toTarget, toTheta, toZoom, dur) {
  const off = camera.position.clone().sub(controls.target);
  const sph = new THREE.Spherical().setFromVector3(off);
  camAnim = { t: 0, dur: RM ? 0.0001 : dur, fromT: controls.target.clone(), toT: toTarget.clone(), fromTheta: sph.theta, toTheta, radius: sph.radius, fromZoom: camera.zoom, toZoom };
}
function stepCamera(dt) {
  if (!camAnim) return;
  camAnim.t = Math.min(1, camAnim.t + dt / camAnim.dur);
  const k = easeInOut(camAnim.t);
  controls.target.lerpVectors(camAnim.fromT, camAnim.toT, k);
  const th = camAnim.fromTheta + (camAnim.toTheta - camAnim.fromTheta) * k;
  camera.position.copy(controls.target).add(new THREE.Vector3().setFromSphericalCoords(camAnim.radius, POLAR, th));
  camera.zoom = camAnim.fromZoom + (camAnim.toZoom - camAnim.fromZoom) * k;
  camera.updateProjectionMatrix();
  if (camAnim.t >= 1) camAnim = null;
}
const currentTheta = () => new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target)).theta;
function rotateBy(delta) { const th = currentTheta(); animateCamera(controls.target, Math.round((th - Math.PI / 4) / (Math.PI / 2)) * (Math.PI / 2) + Math.PI / 4 + delta, camera.zoom, 0.55); }
function resetView() { const th = currentTheta(); const home = Math.PI / 4 + Math.round((th - Math.PI / 4) / (Math.PI * 2)) * Math.PI * 2; animateCamera(HOME, home, 1, 0.6); }
function panTo(x, z) { animateCamera(new THREE.Vector3(x, 0, z).lerp(HOME, 0.35), currentTheta(), Math.max(camera.zoom, 1.25), 0.5); }

// ---------- Walls that face the camera get cut away ----------
const camDir = new THREE.Vector3();
function updateWalls() {
  camDir.copy(camera.position).sub(controls.target).setY(0).normalize();
  for (const w of walls) w.g.visible = w.n[0] * camDir.x + w.n[1] * camDir.z < 0.3;
}

// ---------- Input ----------
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let downAt = null;
function pickAt(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObjects(pickables, false).find((x) => x.object.userData.pick && x.object.visible);
  return hit ? hit.object.userData.pick : null;
}
renderer.domElement.addEventListener('pointerdown', (ev) => { downAt = [ev.clientX, ev.clientY]; camAnim = null; });
renderer.domElement.addEventListener('pointerup', (ev) => {
  if (!downAt || Math.hypot(ev.clientX - downAt[0], ev.clientY - downAt[1]) > 6) return;
  const p = pickAt(ev);
  select(p ? (p.type === 'room' ? { type: 'room' } : { type: 'session', id: p.id }) : null);
});
renderer.domElement.addEventListener('pointermove', (ev) => {
  if (ev.buttons) return;
  renderer.domElement.style.cursor = pickAt(ev) ? 'pointer' : '';
});

let toastTimer;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600); }

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-goto],[data-room],[data-back],[data-action]');
  if (!el) return;
  if (el.dataset.goto) select({ type: 'session', id: el.dataset.goto });
  else if (el.dataset.room) select({ type: 'room' });
  else if (el.dataset.back) select(null);
  else if (el.dataset.action === 'focus') toast('Would bring tmux pane ' + sess(ui.sel.id).pane + ' to the front (not wired in this mockup).');
  else if (el.dataset.action === 'seen') setState(ui.sel.id, 'idle', {}, 'reviewed by you, off to the lounge');
  else if (el.dataset.action === 'copy') {
    const code = $('resume-cmd');
    const fallback = () => { const range = document.createRange(); range.selectNodeContents(code); const s = getSelection(); s.removeAllRanges(); s.addRange(range); toast('Command selected. Press Cmd+C to copy it.'); };
    try { navigator.clipboard.writeText(code.textContent).then(() => toast('Resume command copied.'), fallback); } catch (err) { fallback(); }
  }
});
$('rot-left').addEventListener('click', () => rotateBy(-Math.PI / 2));
$('rot-right').addEventListener('click', () => rotateBy(Math.PI / 2));
$('reset-view').addEventListener('click', resetView);
$('sim-toggle').addEventListener('click', () => { if (ui.ended) return; ui.playing = !ui.playing; $('sim-toggle').textContent = ui.playing ? 'Pause' : 'Play'; });
$('sim-restart').addEventListener('click', () => { resetWorld(); });
document.addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('input, textarea')) return;
  if (e.key === 'q' || e.key === 'Q') rotateBy(-Math.PI / 2);
  else if (e.key === 'e' || e.key === 'E') rotateBy(Math.PI / 2);
  else if (e.key === 'r' || e.key === 'R') resetView();
  else if (e.key === 'Escape') select(null);
});

// ---------- Theme ----------
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

// ---------- Loop ----------
const clock = new THREE.Clock();
let time = 0, clockShown = -1;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  time += dt;
  if (ui.playing) {
    ui.simTime += dt;
    while (nextEvent < EVENTS.length && ui.simTime >= EVENTS[nextEvent].at) EVENTS[nextEvent++].fn();
  }
  const sec = Math.floor(ui.simTime);
  if (sec !== clockShown) { clockShown = sec; $('sim-clock').textContent = Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }
  [...mascots.values()].forEach((m) => m.update(dt, time));
  elevator.update(dt);
  stepCamera(dt);
  controls.update();
  updateWalls();
  updateRing(time);
  renderer.render(scene, camera);
  positionLabels();
}
document.addEventListener('visibilitychange', () => { renderer.setAnimationLoop(document.hidden ? null : frame); if (!document.hidden) clock.getDelta(); });

applyTheme();
resetWorld();
renderer.setAnimationLoop(frame);
